services:
  postgres:
    image: bitnami/postgresql
    container_name: mykeeper_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: mykeeper_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: